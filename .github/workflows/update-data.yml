name: Update Football Data

on:
  schedule:
    # Ogni giorno alle 17:00 UTC (18:00 ora di Roma in inverno).
    # Con la sola Serie A un giro costa 3 crediti The Odds API: 90 al mese sui
    # 500 gratuiti. Il giro giornaliero serve a due cose: le quote sono sempre
    # fresche, e il confronto fra la quota presa e quella di chiusura (il CLV
    # nella sezione "Verifica del modello") diventa affidabile, perche' abbiamo
    # un'istantanea al giorno invece di cinque alla settimana.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Un solo run alla volta: due run contemporanei litigano sul push.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data updater
        env:
          FDKEY: ${{ secrets.FDKEY }}
          ODDSKEY: ${{ secrets.ODDSKEY }}
        run: python src/update_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati: niente da committare."
            exit 0
          fi
          git commit -m "Auto-update data"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push non riuscito (tentativo $i), riprovo tra 5s..."
            sleep 5
          done
          echo "Push non riuscito dopo 3 tentativi."
          exit 1
